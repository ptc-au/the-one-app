[package]
name = "widgets"
description = "What an iPhone's Widget Extension asks its network through: the app's client, opened from the App Group the two share."
version.workspace = true
edition.workspace = true
license.workspace = true

# An iPhone's Widget Extension (`clients/app/gen/apple/Widgets`) links it, as the app links `libapp.a`, and Android's
# app has it in its own.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow.workspace = true
client = { path = "../../../core/client" }
serde_json.workspace = true
tokio.workspace = true

[package]
name = "web-renderer"
description = "The renderer (clients/app/renderer) as the web client draws an app's page with it: WebAssembly, on the browser's WebGPU, built by wasm-bindgen."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# The web gate's frame alone: a bug put back as its address asks (`renderer::mutants`).
mutants = ["renderer/mutants"]

[dependencies]
renderer = { path = "../../app/renderer" }

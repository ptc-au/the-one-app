<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9f9fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Download</title>
<link rel="stylesheet" href="./download.css">
<!-- The worker fills in the network's name, address and apps, and finds its files (`download.ts`). -->
<header class="top">
  <a class="brand" href="/">
    <picture><source srcset="/Logo-dark.png" media="(prefers-color-scheme: dark)"><img src="/Logo.png" alt=""></picture>
    <span data-name>the One App</span>
  </a>
  <a class="button outline" href="/">Open Web App</a>
</header>
<main>
  <section class="hero" data-hero></section>
  <section class="more" data-others>
    <h2>Other platforms</h2>
    <ul class="platforms" data-platforms></ul>
  </section>
  <section class="phone" data-phone>
    <div class="qr" data-qr></div>
    <div>
      <h2>On your phone</h2>
      <p>Point your phone's camera at the code to open this page there.</p>
      <p class="address" data-address></p>
    </div>
  </section>
</main>
<footer class="foot">
  <span data-host></span>
  <a href="/privacy">Privacy</a>
  <a href="/">Open Web App</a>
</footer>
<!-- An iPad's Safari says it's a Mac: one with a touch screen is shown the iPhone's app. -->
<script>
  if (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform) && !location.search) location.replace("?for=iphone")
</script>

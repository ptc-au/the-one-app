<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#6d7cff"/>
      <stop offset="0.52" stop-color="#4e56e8"/>
      <stop offset="1" stop-color="#2e31a8"/>
    </linearGradient>
    <radialGradient id="hl" cx="0.5" cy="-0.05" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.36"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.52"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e6ff"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe3ff"/>
      <stop offset="1" stop-color="#bbc3ff"/>
    </linearGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#171966" flood-opacity="0.5"/>
    </filter>
    <clipPath id="squircle">
      <rect x="0" y="0" width="100" height="100" rx="22.5" ry="22.5"/>
    </clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect x="0" y="0" width="100" height="100" fill="url(#bg)"/>
    <rect x="0" y="0" width="100" height="100" fill="url(#hl)"/>
    <g filter="url(#sh)">
      <!-- Left column: two task cards -->
      <rect x="20" y="22" width="26" height="24" rx="6" fill="url(#card)"/>
      <rect x="25" y="29" width="14" height="3.2" rx="1.6" fill="#4e56e8"/>
      <rect x="25" y="36" width="10" height="2.8" rx="1.4" fill="#9ba3f5"/>
      <rect x="20" y="51" width="26" height="27" rx="6" fill="url(#card2)"/>
      <rect x="25" y="58" width="15" height="3.2" rx="1.6" fill="#5e66eb"/>
      <rect x="25" y="65" width="11" height="2.8" rx="1.4" fill="#8992f0"/>
      <!-- Right column: tall thread card + status pill -->
      <rect x="52" y="22" width="28" height="38" rx="6" fill="url(#card)"/>
      <rect x="57" y="29" width="16" height="3.2" rx="1.6" fill="#4e56e8"/>
      <rect x="57" y="36" width="18" height="2.8" rx="1.4" fill="#9ba3f5"/>
      <rect x="57" y="43" width="12" height="2.8" rx="1.4" fill="#b7bdf8"/>
      <circle cx="60" cy="52" r="2.8" fill="#4e56e8"/>
      <rect x="65" y="50.5" width="10" height="3" rx="1.5" fill="#7c85f2"/>
      <rect x="52" y="65" width="28" height="13" rx="6" fill="url(#card2)"/>
      <rect x="57" y="70" width="18" height="3" rx="1.5" fill="#5e66eb"/>
    </g>
    <rect x="1.1" y="1.1" width="97.8" height="97.8" rx="21.5" ry="21.5" fill="none" stroke="url(#edge)" stroke-width="2.2"/>
  </g>
</svg>

# What building needs that isn't Rust: `mise install` here installs it.
[tools]
erlang = "29.1.2"
elixir = "1.20.5-otp-29"
bun = "1.4.4"
rustfs = "1.0.5"
# What `tooling/release` builds a server for another kind of machine with: its Rust NIFs, for an older glibc too.
zig = "0.15.2"
"github:rust-cross/cargo-zigbuild" = "0.24.1"
# And for Windows, with the MSVC CRT and Windows SDK it downloads, as Windows' own toolchain builds there.
"github:rust-cross/cargo-xwin" = "0.23.1"
# And DXC, which compiles Windows' shaders ahead of time (clients/app/renderer/build.rs).
"github:microsoft/DirectXShaderCompiler" = "1.9.2609"
# What signs a Mac's server and app with the owner's Developer ID (`tooling/release`), here.
"github:indygreg/apple-platform-rs" = "0.29.0"
# And what signs a Windows program and installer, as Power to Change (`tooling/windows-sign`), here: jsign, on Java.
"github:ebourg/jsign" = { version = "7.6", asset_pattern = "jsign-7.6.jar", bin = "jsign.jar" }
# What gives a network's Android app its name and icon, in the plain APK's resources (`tooling/android-apk`): apktool, on Java.
"github:iBotPeaches/Apktool" = { version = "2.12.1", asset_pattern = "apktool_2.12.1.jar", bin = "apktool.jar" }
# What builds the web client's renderer (`clients/web/renderer`, `core/edge/edge.js`): wasm-bindgen, at the version
# its crate pins, and binaryen's wasm-opt.
"github:wasm-bindgen/wasm-bindgen" = "0.2.130"
"github:WebAssembly/binaryen" = { version = "133", version_prefix = "version_" }
